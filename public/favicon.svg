<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lavera-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a1c38"/>
      <stop offset="100%" stop-color="#55091d"/>
    </linearGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8b2"/>
      <stop offset="50%" stop-color="#dfb76c"/>
      <stop offset="100%" stop-color="#b88628"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#lavera-bg)" stroke="url(#gold-foil)" stroke-width="2.5"/>

  <!-- Stylized Elegant Flower Petals -->
  <g fill="none" stroke="url(#gold-foil)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center bud -->
    <path d="M32 18 C30 22, 28 26, 32 30 C36 26, 34 22, 32 18 Z" fill="url(#gold-foil)" fill-opacity="0.3"/>
    
    <!-- Inner petals -->
    <path d="M28 22 C22 25, 23 32, 29 33 C31 30, 30 25, 28 22 Z"/>
    <path d="M36 22 C42 25, 41 32, 35 33 C33 30, 34 25, 36 22 Z"/>
    
    <!-- Outer petals -->
    <path d="M24 28 C18 33, 20 40, 28 39 C29 35, 26 31, 24 28 Z"/>
    <path d="M40 28 C46 33, 44 40, 36 39 C35 35, 38 31, 40 28 Z"/>
    
    <!-- Lower petals & stem -->
    <path d="M28 38 C32 43, 32 48, 32 50"/>
    <path d="M32 42 C26 44, 25 47, 26 48"/>
    <path d="M32 44 C38 46, 39 49, 38 50"/>
  </g>
</svg>